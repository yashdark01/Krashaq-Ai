server:
  http_listen_port: 9080

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: krashaq-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: krashaq
          environment: development

  - job_name: krashaq-json-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: krashaq-json
          environment: development
          __path__: /var/log/krashaq/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: levelname
            correlation_id: correlation_id
            user_id: user_id
            endpoint: endpoint
            method: method
            status_code: status_code
            response_time: response_time
      - labels:
          timestamp:
          level:
          correlation_id:
          user_id:
          endpoint:
          method:
          status_code:
      - timestamp:
          source: timestamp
          format: RFC3339
