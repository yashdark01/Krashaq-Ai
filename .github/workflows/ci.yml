name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  app:
    name: App — lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        env:
          GROQ_API_KEY: ci-stub-key
          MONGODB_URL: mongodb://127.0.0.1:27017
          MONGODB_DB: krashaq_ci
          JWT_SECRET_KEY: ci-jwt-secret-min-32-chars-long!!
          LLM_PROVIDER: groq
        run: npm run build

  rag-eval:
    name: RAG faithfulness eval
    runs-on: ubuntu-latest
    if: ${{ secrets.GROQ_API_KEY != '' || secrets.GOOGLE_API_KEY != '' || secrets.OPENAI_API_KEY != '' || secrets.HF_TOKEN != '' }}

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      EMBEDDING_PROVIDER: ${{ secrets.GROQ_API_KEY != '' && 'groq' || (secrets.OPENAI_API_KEY != '' && 'openai' || (secrets.HF_TOKEN != '' && 'huggingface' || 'gemini')) }}
      MONGODB_URL: mongodb://127.0.0.1:27017
      MONGODB_DB: krashaq_ci
      RAG_EVAL_MIN_PASS_RATE: '0.85'
      RAG_EVAL_MIN_POSITIVE_RECALL: '0.9'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build FAISS index
        run: npm run kb:ingest:force

      - name: RAG faithfulness eval
        run: npm run eval:rag

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high || true
