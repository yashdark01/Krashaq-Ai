name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        env:
          # Stub secrets so build/type-check succeeds in CI (not used at runtime)
          GROQ_API_KEY: ci-stub-key
          MONGODB_URL: mongodb://127.0.0.1:27017
          MONGODB_DB: krashaq_ci
          JWT_SECRET_KEY: ci-jwt-secret-min-32-chars-long!!
          LLM_PROVIDER: groq
        run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high || true
